<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>

<body style="margin: 0; padding: 30px; font-family: 'Times New Roman';">

<form style="
    box-sizing: border-box;
    width: 480px;
    height: 300px;
    border: 3px solid #888;
    padding: 15px;
    overflow-y: scroll;
    overflow-x: hidden;
">

    <label style="display: inline-block; width: 75px;">
        Name:
    </label>

    <input type="text"
           placeholder="your name here"
           style="width: 300px; height: 20px; font-family: 'Times New Roman', Times, serif">
    <br><br>


    <label style="display: inline-block; width: 75px;">
        Email:
    </label>

    <input type="text"
           placeholder="your email here"
           style="width: 340px; height: 20px; font-family: 'Times New Roman', Times, serif">
    <br><br>


    <label style="
        display: inline-block;
        width: 75px;
        vertical-align: middle;
    ">
        Address:
    </label>

    <textarea style="
        width: 255px;
        height: 90px;
        vertical-align: middle;
        overflow-y: scroll;
        overflow-x: hidden;
        resize: none;
    ">25 Nowhere Street
Somewhere
Not Here
YZK SRU</textarea>

    <br><br>


    <label style="display: inline-block; width: 75px;">
        Postcode:
    </label>

    <input type="text"
           placeholder="postal code"
           style="width: 175px; height: 20px; font-family: 'Times New Roman', Times, serif">

    <br><br><br><br><br><br><br><br>

</form>

</body>
</html>
